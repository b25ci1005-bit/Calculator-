<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="2.css">
</head>
<body class="light-mode">

    <div class="calculator">
        <div class="theme-box">
            <button id="themeToggleBtn">🌙 Dark Mode</button>
        </div>

        <h2>Basic Calculator</h2>

        <div class="input-field">
            <label>First Number</label>
            <input type="number" id="num1">
        </div>

        <div class="input-field">
            <label>Second Number</label>
            <input type="number" id="num2">
        </div>

        <div class="buttons-grid">
            <button id="addBtn">+</button>
            <button id="subBtn">-</button>
            <button id="mulBtn">x</button>
            <button id="divBtn">÷</button>
        </div>

        <div class="result-section">
            <h3>Result</h3>
            <div id="resultDisplay" class="result-box"></div>
        </div>

        <div class="history-section">
            <h3>History</h3>
            <ul id="historyList">
                <li class="empty-history">No recent calculations</li>
            </ul>
            <button id="clearHistoryBtn" class="clear-btn">Clear</button>
        </div>
    </div>

    <script src="3.js"></script>
</body>
</html>
